name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA; it must equal origin/main HEAD
        required: true
        type: string
      change_type:
        description: Release change classification
        required: true
        type: choice
        options:
          - frontend
          - backend
          - deps
          - schema
          - uploads
          - runtime
      confirm_production:
        description: Type DEPLOY to confirm the production preflight
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wufan-workstation-production
  cancel-in-progress: false

jobs:
  production-preflight:
    name: Production dry-run (deployment blocked)
    runs-on:
      - self-hosted
    timeout-minutes: 10
    env:
      PROJECT_DIR: /Users/meiyounaichatouyuna/Projects/goal-execution-system
      NODE22_BIN: /opt/homebrew/opt/node@22/bin
      COMMIT_SHA: ${{ inputs.commit_sha }}
      CHANGE_TYPE: ${{ inputs.change_type }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v4

      - name: Validate manual production confirmation
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_PRODUCTION" != "DEPLOY" ]]; then
            echo "confirm_production must exactly equal DEPLOY." >&2
            exit 1
          fi
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full 40-character Git SHA." >&2
            exit 1
          fi

      - name: Run release preparation dry-run
        run: |
          "$GITHUB_WORKSPACE/scripts/release-prepare.sh" \
            --commit "$COMMIT_SHA" \
            --change-type "$CHANGE_TYPE" \
            --dry-run

      - name: Block deployment until release backup workflow is ready
        run: |
          echo "release backup workflow not ready" >&2
          echo "No source update, dependency installation, PM2 restart, or database change was performed." >&2
          exit 1
