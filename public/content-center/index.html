<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="公司内容日历，只管内容与排期。"><title>内容中心</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./style.css"><script type="module" src="./bridge.js"></script></head>
<body><main><header><div class="brand">公司 <span>CONTENT</span></div><h1>内容日历</h1><a class="backup" href="/api/backup" download>导出备份</a><button class="primary" id="new-note">＋ 新增笔记</button></header><nav id="main-nav" aria-label="主导航"><button data-page="requests" aria-pressed="false">下周需求</button><button data-page="candidates" aria-pressed="false">内容候选</button><button data-page="calendar" aria-pressed="true">内容日历</button><button data-page="configuration" aria-pressed="false">账号与栏目</button></nav><div id="load-error" role="alert" hidden></div><section id="workspace" aria-label="内容日历"><p class="empty">正在读取内容…</p></section><footer>下周需求 → 内容候选 → 排期与发布</footer></main>
<dialog id="editor"><form id="note-form"><div class="dialog-heading"><h2 id="editor-title">新增笔记</h2><button type="button" id="close-editor" aria-label="关闭编辑">×</button></div><div id="editor-fields"></div><div class="dialog-footer"><span id="form-error" role="alert"></span><button type="button" id="cancel-editor">取消</button><button type="submit" id="save-as-candidate" value="candidate" hidden>存入内容候选</button><button class="primary" type="submit" id="save-note">保存笔记</button></div></form></dialog>
<dialog id="detail"><div class="dialog-heading"><h2>笔记详情</h2><button id="close-detail" aria-label="关闭详情">×</button></div><div id="detail-content"></div></dialog>
<dialog id="image-picker"><div class="dialog-heading"><h2>选择已有图片</h2><button id="close-picker" aria-label="关闭图片库">×</button></div><div id="image-library"></div><div class="dialog-footer"><button id="finish-picker" class="primary">完成选择</button></div></dialog><div id="toast" role="status" hidden></div>
<dialog id="reference-editor"><form id="reference-form"><div class="dialog-heading"><h2 id="reference-title"></h2><button type="button" id="close-reference" aria-label="关闭资料">×</button></div><div id="reference-fields"></div><div class="dialog-footer"><span id="reference-error" role="alert"></span><button type="submit" class="primary">保存并关联</button></div></form></dialog></body></html>
